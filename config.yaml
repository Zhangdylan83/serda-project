# All paths are supplied at execution. No patient data belongs in this file.
lookback_days: 365
baseline_tolerance_days: 90
followup_tolerance_days: 60
# Numeric dates are interpreted as Excel serial dates only in this range.
excel_date_min: 20000
excel_date_max: 80000
dayfirst: false
# Set true only when an output directory containing prior outputs is intended.
overwrite: false
# For ambiguous files/sheets/headers, supply exact observed values here.
files: {}
sheets: {}
header_rows: {}
columns: {}
# Example structure: columns: {medications: {medication: "EXACT REAL HEADER"}}
# Units must be verified from actual exports; no default unit assumptions.
weight_units: {kg: 1.0, kilogram: 1.0, kilograms: 1.0, lb: 0.45359237, lbs: 0.45359237, pounds: 0.45359237}
height_units: {cm: 0.01, centimeters: 0.01, m: 1.0, meters: 1.0, in: 0.0254, inches: 0.0254}

# Strict remains the default for final cohort work.
# Provisional EDA: exclude_ambiguous_for_eda retains exactly one valid calendar day
# per patient and normalizes it to midnight; never selects earliest/latest dates.
cohort_anchor_policy: strict_timestamp
temporal_granularity: timestamp  # calendar_day changes distances, not eligibility after anchor
# Use pre_anchor_date_only when event timing on the anchor day is insufficient.
anchor_day_policy: at_or_before_timestamp

# --patient-key mrn adds a separate MRN linkage audit. The default PAT_ID
# pipeline, feature table, and cohort definition are unchanged.
# MRN column overrides use columns.<dataset>.mrn; never map this to PAT_ID.
mrn_audit:
  batch_rows: 2000

# Notes is an eighth AUDIT ONLY dataset; no change to clinical predictors/cohort.
# Also supports files.notes, sheets.notes, header_rows.notes, columns.notes.
notes:
  # Configure mapped field names only AFTER verifying the export's note granularity.
  # Example only: [note_id] when NOTE_ID is confirmed as the note identifier.
  # NOTE_CSN alone is not assumed to identify a unique note.
  # Candidate text grain for this export; not a claim of global document identity.
  # No automatic NOTE_ID/NOTE_CSN fallback. Empty list disables candidate grouping.
  note_key_fields: [note_csn]
  note_key_verified: false
  line_start: 1  # confirm 0 vs 1 locally; contiguous lines do not prove no missing tail
  encounter_linkage_verified: false  # needed for a custom encounter field/NOTE_CSN mapping
  export_reconstructed_text: false  # optional PHI JSONL in approved SERDA output only
  batch_rows: 1000
  max_fragments_per_note: 100000
  max_note_characters: 5000000

# Optional --ga-extraction-only mode. Verify note identity and actual headers
# inside SERDA before enabling notes.note_key_verified above. The patterns are
# conservative candidate-selection rules, not a clinician-approved schema.
ga_extraction:
  fragment_join: newline  # newline, space, or none; confirm export semantics
  validated_denominators: {}  # populate only after Erika confirms instrument versions/ranges
  note_type_patterns:
    - "geriatric\\s+oncology\\s+initial\\s+consult(?:ation)?"
    - "geriatric\\s+assessment"
  template_patterns:
    - "geriatric\\s+components?"
    - "geriatric\\s+assessment"

# Optional three-stage SERDA-only development review; sample approvals are local
# to sample_manifest.csv and never enable global notes.note_key_verified.
ga_validation:
  sample_size: 8
